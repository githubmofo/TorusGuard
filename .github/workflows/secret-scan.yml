name: Secret Scanning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret & Credential Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for Unintended Secret Files
        run: |
          echo "Scanning repository for unignored credential and key files..."
          # Fail if actual unignored .env files exist
          if find . -maxdepth 3 -name ".env" ! -name ".env.example" | grep -q .; then
            echo "Error: Found unignored .env file"
            exit 1
          fi
          # Fail if private key files or raw credentials exist
          if find . -name "*.pem" -o -name "*.key" -o -name "service-account*.json" | grep -q .; then
            echo "Error: Found private key or service account file"
            exit 1
          fi
          echo "Secret scan passed: No exposed credential files detected."
