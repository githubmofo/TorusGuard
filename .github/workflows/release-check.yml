name: Release Verification Check

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-release:
    name: Validate Release State
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Version in CHANGELOG.md and Releases
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "Verifying tag $TAG_NAME (version $VERSION)..."
          grep -F "## [$VERSION]" CHANGELOG.md || (echo "Version $VERSION missing from CHANGELOG.md" && exit 1)
          test -f "docs/releases/v$VERSION.md" || (echo "Release note docs/releases/v$VERSION.md missing" && exit 1)

      - name: Compile All Python Fixtures
        run: |
          python -m compileall examples/python/

      - name: Verify Documentation Structure
        run: |
          test -f docs/python-rule-mapping.md || exit 1
          test -f docs/validation/cross-platform-rule-parity.md || exit 1
          test -f docs/validation/README.md || exit 1
