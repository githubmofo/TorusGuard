projects:
  - id: flask-cms
    path: https://github.com/pallets/flask.git
    authorized: true
    frameworks:
      - Flask
    expected_source_files_min: 50
    tests:
      - "pytest"
    apply_mode: dry-run-first
    exclusions:
      - ".venv/"
      - "node_modules/"
      - "migrations/"
      - "generated/"
    seeded_cases:
      - seed_id: SEED-FLASK-01
        rule_id: TG-INPUT-005
        expected_path: src/flask/templating.py
        expected_detection: true

  - id: django-core
    path: https://github.com/django/django.git
    authorized: true
    frameworks:
      - Django
    expected_source_files_min: 50
    tests:
      - "python tests/runtests.py"
    apply_mode: dry-run-first
    exclusions:
      - ".venv/"
      - "node_modules/"
    seeded_cases:
      - seed_id: SEED-DJANGO-01
        rule_id: TG-AUTH-008
        expected_path: django/contrib/auth/middleware.py
        expected_detection: true

